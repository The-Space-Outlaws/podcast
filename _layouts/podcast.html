---
layout: default
---

<small>{{ page.date | date: "%-d %B %Y" }}</small>
<h2>
    {{ page.title }}
    <br />
    {% if page.banner-url %}
        <img id="banner-url" src="{{page.banner-url| relative_url}}" alt="banner" style = "width:200px;"/>
        {% endif %}
    <br />
    <small>{{ page.subtitle }}</small>
</h2>

<section>
    <audio class="podcast" preload="auto" controls>
      <source src="{{ page.mp3-url | prepend: site.baseurl | prepend: site.url }}" type="audio/mp3" />
    </audio>
</section>

<h3>About The Episode</h3>
{{content}}

{% if page.keywords %}
  <small>tags: <em>{{ page.keywords | join: "</em>, <em>" }}</em></small>
{% endif %}
<h2>Comments</h2>
<hr>

        data-repo="The-Space-Outlaws/podcast"
        data-repo-id="R_kgDOVeYzDw"
        data-category-id="DIC_kwDOVeYzD84DLJV8"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="1"

        data-theme="catppuccin_mocha"
